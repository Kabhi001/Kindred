<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kindred · hostel roommate matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f8f2f4;--surface:#ffffffcc;--ink:#35293f;--soft:#6a5d78;--line:#35293f26;--lav:#d4c6f5;--lv:#8566d1;--rd:#e0709f;--peach:#ffd9c9;--sage:#d6e8da;--butter:#fff1c4;--rose:#f7c4d8;--warn:#c2410c;
--serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;--sans:"Quicksand","Trebuchet MS",system-ui,sans-serif;--hand:"Caveat","Segoe Print",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1424;--surface:#2a2138cc;--ink:#f4ecfb;--soft:#bbaed1;--line:#f4ecfb2b;--lv:#bda2ff;--rd:#ff8fbb;--lav:#4a3a73;--peach:#5a3a40;--sage:#2f4a3c;--butter:#554a2a;--rose:#5e3450;--warn:#fdba74}}
:root[data-theme="dark"]{--bg:#1a1424;--surface:#2a2138cc;--ink:#f4ecfb;--soft:#bbaed1;--line:#f4ecfb2b;--lv:#bda2ff;--rd:#ff8fbb;--lav:#4a3a73;--peach:#5a3a40;--sage:#2f4a3c;--butter:#554a2a;--rose:#5e3450;--warn:#fdba74}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;z-index:50;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;z-index:-1;pointer-events:none}
.o1{width:46vmax;height:46vmax;background:var(--lav);left:-14vmax;top:-14vmax;animation:d1 22s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;background:var(--peach);right:-12vmax;bottom:-10vmax;animation:d2 26s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vmax,8vmax) scale(1.15)}}@keyframes d2{to{transform:translate(-14vmax,-8vmax) scale(.9)}}
:focus-visible{outline:2px solid var(--lv);outline-offset:3px;border-radius:10px}
.wrap{max-width:900px;margin:0 auto;padding:0 22px 80px}
.nv{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 0}
.logo{font:italic 500 30px var(--serif);background:none;border:0;color:var(--ink);cursor:pointer;padding:0}.logo span{color:var(--lv)}
.nl{display:flex;gap:4px;flex-wrap:wrap}.nl button{background:none;border:0;font:600 15px var(--sans);color:var(--soft);padding:8px 16px;border-radius:99px;cursor:pointer;transition:background .25s}
.nl button:hover{color:var(--ink)}.nl button.on{background:var(--ink);color:var(--bg)}
h1,h2,h3{font-family:var(--serif);font-style:italic;font-weight:400;line-height:1.05;margin:0}
h1{font-size:clamp(44px,8vw,84px);margin-top:12px}h2{font-size:clamp(32px,5vw,46px)}h3{font-size:27px}
.hand{font-family:var(--hand);font-size:24px;color:var(--lv);line-height:1.2;display:block}
.sub{color:var(--soft);max-width:36em;margin:14px 0 24px}.sm{font-size:13.5px;color:var(--soft)}
.swap{animation:in .6s cubic-bezier(.2,.8,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(18px)}}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:34px;padding:22px 26px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font:600 15px var(--sans);border:1px solid var(--ink);cursor:pointer;margin-top:14px;transition:transform .25s,box-shadow .25s,opacity .25s}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 24px -12px var(--lv)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gh{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ok{background:var(--sage);color:#35293f;border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:5px 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:#35293f}
.g{background:var(--sage)}.w{background:var(--butter)}.r{background:var(--rose)}.l{background:var(--lav)}
input[type=text],textarea{width:100%;padding:13px 18px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--sans);margin-top:10px}
textarea{height:90px;font:13px/1.4 ui-monospace,Menlo,monospace}
.msg{min-height:26px;margin:12px 4px 0;font-weight:600;font-size:14.5px;color:var(--lv)}.msg.bad,.err{color:var(--warn)}
.cd{display:block;margin-top:10px;padding:12px 16px;border-radius:18px;background:var(--surface);border:1px dashed var(--line);font:12.5px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;user-select:all}
.empty{text-align:center;padding:44px 20px;margin-top:18px}.empty svg{width:200px;height:120px;display:block;margin:0 auto 6px}
.empty circle{fill:none;stroke:var(--lv);stroke-width:2;stroke-dasharray:4 7;transform-origin:center;animation:br 5s ease-in-out infinite}.empty circle+circle{stroke:var(--rd);animation-delay:-2.5s}
@keyframes br{50%{transform:scale(1.08)}}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:italic 500 28px var(--serif);color:#fffe;flex:none}
/* home */
.hero{text-align:center;padding:30px 0 10px}.hero h1{font-size:clamp(48px,8.6vw,100px)}
.ln{display:block;overflow:hidden;padding:.06em .1em .12em}.ln>span{display:block;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}.ln:nth-child(2)>span{animation-delay:.18s}
@keyframes rise{from{transform:translateY(110%) rotate(2deg)}}
.hero .sub{margin:22px auto 8px}.hero .row{justify-content:center}
.rh{margin:36px 0 10px;padding:20px 24px 14px;border-radius:44px;transition:box-shadow 1.2s}.rh.sync{box-shadow:0 0 70px -10px var(--lv)}
.rh svg{display:block;width:100%;height:auto}.rh path{fill:none;stroke-width:3.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
#wa{stroke:var(--lv);filter:drop-shadow(0 0 7px var(--lv))}#wb{stroke:var(--rd);filter:drop-shadow(0 0 7px var(--rd))}
#cap{font:600 27px var(--hand);color:var(--lv);text-align:right}
.jy{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stp{padding:22px;border-radius:30px;border:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:transform .3s;position:relative}
.stp:hover{transform:translateY(-6px) rotate(-1deg)}.stp h3{font-size:24px;margin:8px 0 4px}.stp span{font-size:14px;opacity:.8}
.stp i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-style:normal;background:#ffffff88;color:#35293f;font-weight:700}
.stp.done i{background:var(--lv);color:#fff}.stp.next{box-shadow:0 0 0 2px var(--lv),0 20px 40px -24px var(--lv)}
.s0{background:var(--rose)}.s1{background:var(--butter)}.s2{background:var(--sage)}.s3{background:var(--peach)}
.stp{color:#35293f}
/* quiz */
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 22px}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lv),var(--rose));transition:width .7s}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.op{padding:18px 20px;border-radius:24px;border:2px solid transparent;font:500 16px/1.35 var(--sans);color:#35293f;text-align:left;cursor:pointer;transition:transform .25s}
.op:hover{transform:translateY(-4px) rotate(-.6deg)}.op.on{border-color:var(--lv);transform:scale(1.02)}
.op{color:var(--ink) !important;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,0.04)}
.c0{border-left:5px solid var(--rd);background:var(--surface)}
.c1{border-left:5px solid var(--butter);background:var(--surface)}
.c2{border-left:5px solid var(--sage);background:var(--surface)}
.c3{border-left:5px solid var(--lv);background:var(--surface)}
.imp{margin-top:24px;padding:14px 18px;border-radius:26px;background:var(--surface);border:1px dashed var(--line)}
.pill{padding:8px 18px;margin:8px 8px 0 0;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 14px var(--sans);cursor:pointer}.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* bloom */
.bw{padding:10px 44px}svg.bl{display:block;width:100%;max-width:300px;margin:0 auto;overflow:visible}
.gr{fill:none;stroke:var(--line);stroke-dasharray:2 5}.ax{stroke:var(--line)}.lb{font:600 11px var(--sans);fill:var(--soft)}
.pt{transform-origin:150px 150px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.06s);fill-opacity:.3}@keyframes grow{from{transform:scale(0);opacity:0}}
.fm{fill:var(--lv);stroke:var(--lv)}.fp{fill:var(--rd);stroke:var(--rd)}
/* matches */
.pc{position:relative;display:grid;grid-template-columns:250px 1fr;gap:10px 26px;align-items:center;margin-top:22px;animation:in .7s both;animation-delay:calc(var(--i)*.1s)}
.pc.top{border-color:var(--lv);box-shadow:0 22px 50px -30px var(--lv)}
.rib{position:absolute;top:-14px;left:28px;background:var(--lv);color:#fff;font:600 22px var(--hand);padding:0 16px;border-radius:99px;transform:rotate(-2deg)}
.tr{display:flex;gap:14px;align-items:center;justify-content:space-between}.who{display:flex;gap:14px;align-items:center}
.sc{font:italic 500 56px/1 var(--serif)}.sc small{font:600 14px var(--sans);color:var(--soft)}
.xp{display:none;grid-column:1/-1;padding-top:18px;border-top:1px dashed var(--line)}.pc.open .xp{display:block}
.tl{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;font-size:13.5px;color:var(--soft);font-weight:600}
.tk{position:relative;height:26px;margin:0 8px}.tk::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.ln2{position:absolute;top:50%;height:4px;border-radius:4px;transform:translateY(-50%);background:linear-gradient(90deg,var(--lv),var(--rd));opacity:.5}
.dt{position:absolute;top:50%;width:var(--s);height:var(--s);border-radius:50%;transform:translate(-50%,-50%);animation:pop .8s .3s both}.dt.a{background:var(--lv)}.dt.b{background:var(--rd)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
/* requests */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 4px}.stat{text-align:center;padding:16px 10px}.stat b{display:block;font:italic 500 52px/1 var(--serif)}.stat span{font-size:14px;color:var(--soft);font-weight:600}
.rq{margin-top:18px;animation:in .7s both;animation-delay:calc(var(--i)*.08s)}.rq.confirmed{border-color:var(--lv);box-shadow:0 22px 50px -32px var(--lv)}
.hd{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.st{padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;color:#35293f}.st.sent{background:var(--butter)}.st.pending{background:var(--rose)}.st.confirmed{background:var(--sage)}.st.declined{background:var(--line);color:var(--soft)}
.nt{font:500 24px/1.2 var(--hand);color:var(--soft);margin:12px 0 0}
.jr{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 6px;text-align:center}
.jr::before,.jr::after{content:"";position:absolute;top:13px;left:16.6%;height:3px;border-radius:3px}.jr::before{right:16.6%;background:var(--line)}
.jr::after{width:calc(66.8%*var(--f));background:linear-gradient(90deg,var(--lv),var(--rd));animation:fw 1.2s .3s both}@keyframes fw{from{width:0}}
.nd i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;margin:0 auto 4px;position:relative;z-index:1;background:var(--bg);border:2px solid var(--line);font-style:normal;font-size:13px}
.nd span{font-size:12.5px;color:var(--soft);font-weight:600}.nd.done i{background:var(--lv);border-color:var(--lv);color:#fff}.nd.no i{background:var(--rd);border-color:var(--rd);color:#fff}
.nd.act i{border-color:var(--lv);animation:pl 2s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 7px #8566d133}}
.pair{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px 18px;border-radius:26px;background:var(--sage);color:#35293f}
.pv{display:flex}.pv .av{width:46px;height:46px;font-size:24px;animation:m1 1.2s .4s cubic-bezier(.2,.8,.2,1) both}.pv .av+.av{margin-left:-14px;animation-name:m2}
@keyframes m1{from{transform:translateX(-30px)}}@keyframes m2{from{transform:translateX(30px)}}
@media (max-width:760px){.g2,.pc{grid-template-columns:1fr}.jy,.ops{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.jy,.ops{grid-template-columns:1fr}.nl button{padding:8px 11px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
<nav class="nv"><button class="logo" data-go="home">kin<span>dred</span></button>
<div class="nl"><button data-go="home">home</button><button data-go="quiz">quiz</button><button data-go="matches">matches</button><button data-go="requests">requests</button></div></nav>
<main id="app"></main>
</div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
var S=ld("kin_app")||{};S.pe=S.pe||[];S.rq=S.rq||[];
function sv(){try{localStorage.setItem("kin_app",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[<>&"']/g,"")}
function enc(p,o){return p+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(p,s){s=s.trim();if(s.indexOf(p)!==0)throw 0;return JSON.parse(decodeURIComponent(escape(atob(s.slice(p.length)))))}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function same(a,b){return esc(a).trim().toLowerCase()===esc(b).trim().toLowerCase()}
function tile(n){var h=hash(n)%360;return "<div class='av' style='background:linear-gradient(150deg,hsl("+h+",70%,78%),hsl("+((h+50)%360)+",75%,72%))'>"+(n[0]||"?").toLowerCase()+"</div>"}
function msg(t,ok){var m=$("#msg");if(m){m.textContent=t;m.className="msg"+(ok?"":" bad")}}
function copy(t,b){try{navigator.clipboard.writeText(t).then(function(){b.textContent="copied"},function(){b.textContent="select the code and copy"})}catch(e){b.textContent="select the code and copy"}}
function empty(h,p,b){return "<div class='card empty'><svg viewBox='0 0 200 120'><circle cx='72' cy='60' r='44'/><circle cx='128' cy='60' r='44'/></svg><h3>"+h+"</h3><p class='sm'>"+p+"</p>"+(b||"")+"</div>"}
var KEYS = ["sleep", "privacy", "noise", "tidy", "temp", "guests", "sharing", "intent", "flexibility", "communication"];
var RANGE = {sleep: 4, privacy: 4, noise: 4, tidy: 4, temp: 4, guests: 4, sharing: 4, intent: 4, flexibility: 4, communication: 4, smoke: 4, wake: 4, study: 4, social: 4};
var BASE = {sleep: 18, privacy: 16, noise: 12, tidy: 12, temp: 8, guests: 10, sharing: 8, intent: 8, flexibility: 4, communication: 4, smoke: 5, wake: 3, study: 3, social: 2};
var MUL = {1: .5, 2: 1, 3: 2};
var SH = {sleep: "Sleep", privacy: "Privacy", noise: "Noise", tidy: "Tidy", temp: "Climate", guests: "Guests", sharing: "Sharing", intent: "Bond", flexibility: "Flexibility", communication: "Openness", smoke: "Smoke", wake: "Morning", study: "Study", social: "Social"};
var NM = {sleep: "sleep schedule", privacy: "personal space", noise: "room sound level", tidy: "cleanliness", temp: "room temperature", guests: "guest policy", sharing: "sharing belongings", intent: "roommate connection", flexibility: "flexibility", communication: "communication", smoke: "smoking/substances", wake: "morning rhythm", study: "study habits", social: "social energy"};
var GOOD = {sleep: "wind down at similar times", privacy: "have aligned personal space needs", noise: "prefer the same room sound level", tidy: "keep a similar level of cleanliness", temp: "prefer similar room temperature and cooling", guests: "feel comfortable with the same guest policy", sharing: "share similar boundaries on belongings", intent: "seek the same kind of roommate relationship", flexibility: "balance flexibility and personal preferences", communication: "handle feedback with open communication", smoke: "share matching substance boundaries", wake: "have matching morning routines", study: "share preferred study spaces", social: "recharge in complementary ways"};
var BAD = {sleep: "different sleep timing", privacy: "different personal space needs", noise: "different noise comfort levels", tidy: "different tidiness expectations", temp: "different room temperature preferences", guests: "different guest boundaries", sharing: "different sharing boundaries", intent: "different expectations for closeness", flexibility: "both have very strong preferences", communication: "both tend to leave issues unspoken", smoke: "conflicting views on smoking/substances", wake: "different wake-up hours", study: "different study environments", social: "different social energies"};
var view=(location.hash||"#home").slice(1);if(["home","quiz","matches","requests"].indexOf(view)<0)view="home";
function go(v,a){view=v;try{history.replaceState(null,"","#"+v)}catch(e){}draw(a);window.scrollTo(0,0)}

/* bloom + score */
function P(r,t){return (150+r*Math.cos(t)).toFixed(1)+","+(150+r*Math.sin(t)).toFixed(1)}
function bloom(L){
  var s="<div class='bw'><svg class='bl' viewBox='0 0 300 300' role='img' aria-label='Trait bloom chart'>";
  [28,56,84,112].forEach(function(r){s+="<circle class='gr' cx='150' cy='150' r='"+r+"'/>"});
  KEYS.forEach(function(k,i){var t=-Math.PI/2+i*Math.PI/4,e=P(112,t).split(","),l=P(128,t).split(","),c=Math.cos(t);
    s+="<line class='ax' x1='150' y1='150' x2='"+e[0]+"' y2='"+e[1]+"'/><text class='lb' x='"+l[0]+"' y='"+(+l[1]+4)+"' text-anchor='"+(c>.3?"start":c<-.3?"end":"middle")+"'>"+SH[k]+"</text>"});
  L.forEach(function(e,n){KEYS.forEach(function(k,i){var t=-Math.PI/2+i*Math.PI/4,len=112*e.p.a[k]/RANGE[k];
    s+="<path class='pt "+e.c+"' style='--i:"+(i+n*3)+";stroke-width:"+(1+(e.p.i[k]-1)*1.4)+"' d='M150,150Q"+P(len*.62,t-.42)+" "+P(len,t)+"Q"+P(len*.62,t+.42)+" 150,150Z'/>"})});
  return s+"</svg></div>";
}
function score(p){
  var me=S.me,tot=0,ws=0,sims={},clash=[];
  KEYS.forEach(function(k){var s=1-Math.abs(me.a[k]-p.a[k])/(RANGE[k]-1),w=BASE[k]*MUL[me.i[k]];tot+=w*s;ws+=w;sims[k]=s;if(me.i[k]===3&&s<.5)clash.push(k)});
  var v=Math.round(tot/ws*100);if(clash.length)v=Math.min(v,59);
  return {v:v,clash:clash,good:KEYS.filter(function(k){return sims[k]>=.99}).sort(function(a,b){return BASE[b]-BASE[a]}).slice(0,3),
    bad:KEYS.filter(function(k){return sims[k]<.5}).sort(function(a,b){return BASE[b]*(1-sims[b])-BASE[a]*(1-sims[a])})[0]};
}
function myCode(){var m=S.me;return enc("KP-",{n:m.n,p:m.p,a:m.a,i:m.i})}
function reqOf(n){return S.rq.filter(function(x){return same(x.peer,n)})[0]}

/* HOME */
function home(){
  var m=S.me,pr=S.rq.filter(function(x){return x.status==="confirmed"}).length;
  var st=[["Take the quiz",m?"done as "+m.n:"Five minutes, made for you.","quiz",!!m],["Meet your matches",S.pe.length?S.pe.length+" student"+(S.pe.length>1?"s":"")+" compared":"Compare real profiles.","matches",S.pe.length>0],["Send a request",S.rq.length?S.rq.length+" request"+(S.rq.length>1?"s":""):"Ask someone to pair.","requests",S.rq.length>0],["Get paired",pr?pr+" confirmed":"Two yeses make a pair.","requests",pr>0]];
  var nx=st.findIndex(function(x){return !x[3]});
  return "<header class='hero'>"+(m?"<span class='hand'>welcome back, "+m.n+"</span>":"<span class='hand'>a hostel roommate matcher</span>")+
  "<h1><span class='ln'><span>find the roommate</span></span><span class='ln'><span>who fits your rhythm.</span></span></h1>"+
  "<p class='sub'>Answer a short quiz about how you live, compare it with real classmates, and send a request. When both say yes, the pair goes to the warden.</p>"+
  "<div class='row'><button class='btn' data-go='"+(nx<0?"matches":st[nx][2])+"'>"+(nx<0?"see my matches":st[nx][0].toLowerCase())+"</button></div>"+
  "<div class='card rh' id='rh'><svg viewBox='0 0 1000 240' preserveAspectRatio='none' aria-hidden='true'><path id='wa'/><path id='wb'/></svg><div id='cap'>out of step</div></div></header>"+
  "<div class='jy'>"+st.map(function(x,i){return "<button class='stp s"+i+(x[3]?" done":"")+(i===nx?" next":"")+"' data-go='"+x[2]+"'><i>"+(x[3]?"✓":i+1)+"</i><h3>"+x[0]+"</h3><span>"+x[1]+"</span></button>"}).join("")+"</div>";
}
var raf;function waves(){
  var wa=$("#wa"),wb=$("#wb"),cap=$("#cap"),box=$("#rh");if(!wa)return;cancelAnimationFrame(raf);var last="",still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function y(x,t,ph,am){var a=x*.011-t*1.1+ph;return 120+am*(Math.sin(a)+.35*Math.sin(2*a+1))/1.35}
  function f(ms){if(!$("#wa"))return;var t=still?4.5:ms/1000,d=Math.PI*(.5+.5*Math.cos(2*Math.PI*t/10)),A="",B="";
    for(var x=0;x<=1000;x+=5){var c=(x?"L":"M")+x+" ";A+=c+y(x,t,0,82).toFixed(1)+" ";B+=c+y(x,t,d,70).toFixed(1)+" "}
    wa.setAttribute("d",A);wb.setAttribute("d",B);var s=d>2?"out of step":d>.7?"finding each other":"in rhythm";
    if(s!==last){last=s;cap.textContent=s;box.classList.toggle("sync",s==="in rhythm")}if(!still)raf=requestAnimationFrame(f)}
  raf=requestAnimationFrame(f);
}

/* QUIZ */
var Q = [
  {
    id: "sleep",
    c: 1,
    t: "On normal college days, when did you usually fall asleep?",
    o: [
      ["Before 11 PM", 1],
      ["Between 11 PM and 1 AM", 2],
      ["Between 1 AM and 3 AM", 3],
      ["After 3 AM (proper night owl)", 4]
    ]
  },
  {
    id: "privacy",
    c: 1,
    t: "How much do you need the room to yourself, to rest, study, or just be alone?",
    o: [
      ["A lot, regularly (need my own bubble)", 1],
      ["Some, a few hours a day", 2],
      ["A little, happy sharing most of the time", 3],
      ["Barely, I like having company around", 4]
    ]
  },
  {
    id: "noise",
    c: 1,
    t: "What does your room usually sound like when you’re in it?",
    o: [
      ["Quiet, need silence to study or sleep", 1],

      ["Music or calls out loud is normal for me", 4]
    ]
  },
  {
    id: "tidy",
    c: 1,
    t: "How often do you properly clean up your desk and space?",
    o: [
      ["Spotless, everything reset daily", 1],
      ["Neat, I tidy up every couple of days", 2],
      ["Lived-in, clean up once a week or so", 3],
      ["Relaxed, a bit of mess doesn’t bother me", 4]
    ]
  },
  {
    id: "guests",
    c: 1,
    t: "How often would you want friends visiting our room?",
    o: [
      ["Almost never, room is just for the two of us", 1],
      ["Occasionally, with a heads-up", 2],
      ["Most weeks, for short visits", 3],
      ["Open door, friends dropping by anytime is great", 4]
    ]
  },
  {
    id: "sharing",
    c: 1,
    t: "How do you feel about people using your snacks, charger, or toiletries?",
    o: [
      ["I’d rather keep my stuff mine", 1],
      ["Fine, but ask me first every time", 2],
      ["Small things are okay without asking", 3],
      ["What’s mine is yours", 4]
    ]
  },
  {
    id: "intent",
    c: 1,
    t: "What are you hoping for in a roommate?",
    o: [
      ["Respectful, and we keep to ourselves", 1],
      ["Friendly, but separate lives and circles", 2],
      ["A good friend, some shared meals and plans", 3],
      ["A close best friend, doing most things together", 4]
    ]
  },
  {
    id: "flexibility",
    c: 1,
    t: "When room rules or plans don’t go your way, you usually...",
    o: [
      ["Adjust easily without fuss", 1],
      ["Adjust after talking it through", 2],
      ["Prefer my way, but willing to compromise", 3],
      ["Strongly prefer my way", 4]
    ]
  },
  {
    id: "communication",
    c: 1,
    t: "If your roommate did something that bugged you, you’d...",
    o: [
      ["Say it within a day, calmly and directly", 1],
      ["Bring it up after a few days if it keeps happening", 2],
      ["Drop subtle hints and hope they get it", 3],
      ["Say nothing to avoid awkwardness", 4]
    ]
  },
  {
    id: "temp",
    c: 1,
    t: "How do you like your room temperature?",
    o: [
      ["Chilly, AC or cooler on strong", 1],
      ["Cool, comfortable moderate AC/cooling", 2],
      ["Moderate, a ceiling fan is plenty for me", 3],
      ["Warm & fresh, prefer windows open and minimal cooling", 4]
    ]
  }
];
var POOL=[{id:"w1",t:"A roommate borrows your charger without asking. You…",o:[["Do not mind",1],["Mention it kindly",2],["Prefer they ask",3]]},{id:"w2",t:"Exam week begins. You want the room to be…",o:[["A silent library",1],["Calm, soft music",2],["Normal life",3]]},{id:"w3",t:"A roommate is homesick. You would…",o:[["Sit and talk",1],["Give them space",2],["Make some tea",3]]},{id:"w4",t:"Sunday morning means…",o:[["Sleeping in",1],["Chai and chatting",2],["Out early",3]]}];
var Z={A:{},I:{},idx:0,scr:"intro",W:[],name:""};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function vis(){return Q.concat(Z.W).filter(function(q){return !q.w||q.w(Z.A)})}
function persona(a){if(!a)return"Roommate";var s=(a.sleep!=null?a.sleep:2);return ["Dawn","Daylight","Moonlit","Midnight"][s-1]+" "+(a.guests>=3?"Host":a.tidy===4?"Curator":a.noise===1?"Sage":a.study===1||a.study===3?"Scholar":a.tidy===1?"Dreamer":"Wanderer")}
function quiz(){
  var m=S.me;
  if(Z.scr==="intro")return "<span class='hand'>a short quiz, made for you</span><h1>let’s learn your rhythm.</h1><p class='sub'>The questions change depending on your answers, so no two people get quite the same quiz.</p><input type='text' id='nm' maxlength='24' placeholder='your first name' aria-label='Your first name' value='"+esc(Z.name||(m&&m.n)||"")+"'><div class='row'><button class='btn' data-q='start'>"+(m?"retake the quiz":"begin")+"</button>"+(m?"<button class='btn gh' data-q='res'>view my results</button>":"")+"</div>";
  if(Z.scr==="res"){
    var a=m.a,ch="<span class='chip l'>the "+m.p+"</span>";KEYS.forEach(function(k){if(m.i[k]===3)ch+="<span class='chip r'>deal-breaker: "+NM[k]+"</span>"});
    return "<span class='hand'>your rhythm, "+m.n+"</span><h1>the "+m.p+".</h1><div class='card' style='margin-top:22px'>"+bloom([{p:m,c:"fm"}])+"<p class='sm' style='text-align:center'>Longer petals mean a higher answer. Thicker edges mean it matters more to you.</p></div><div class='chips'>"+ch+"</div><p class='sub' style='margin-top:18px'>Your profile is saved and ready. Now see who fits it.</p><div class='row'><button class='btn' data-go='matches'>see my matches</button><button class='btn gh' data-q='retake'>retake the quiz</button></div>";
  }
  var v=vis(),q=v[Z.idx],sel=Z.A[q.id],hi=["alright, ","nice, ","good to know, ","one more thing, ","lovely, ","almost there, "];
  var o=q.o.map(function(x,i){return "<button class='op c"+(i%4)+(sel===x[1]?" on":"")+"' data-v='"+x[1]+"'>"+x[0]+"</button>"}).join("");
  var imp=q.c&&sel!==undefined?"<div class='imp'><span class='hand' style='font-size:22px'>how much does this matter to you?</span>"+[["a little",1],["it matters",2],["deal-breaker",3]].map(function(p){return "<button class='pill"+((Z.I[q.id]||2)===p[1]?" on":"")+"' data-imp='"+p[1]+"'>"+p[0]+"</button>"}).join("")+"</div>":"";
  return "<div class='prog'><i style='width:"+Math.round(Z.idx/(v.length+1)*100)+"%'></i></div><span class='hand'>"+hi[Z.idx%6]+(Z.name||"friend")+" · question "+(Z.idx+1)+" of about "+v.length+"</span><h2 style='margin-top:6px'>"+q.t+"</h2><div class='ops'>"+o+"</div>"+imp+"<div class='row'><button class='btn gh' data-q='back'>back</button>"+(q.c?"<button class='btn' data-q='next'"+(sel===undefined?" disabled":"")+">continue</button>":"")+"</div>";
}
function finish(){
  var a={},i={};KEYS.forEach(function(k){a[k]=Z.A[k];i[k]=Z.I[k]||2});
  S.me={n:Z.name||"Friend",p:persona(a),a:a,i:i};sv();Z.scr="res";draw();
}
function qnext(){Z.idx++;if(Z.idx>=vis().length)finish();else draw()}

/* MATCHES */
function lines(me,pe){var pen=(pe&&pe.n)?pe.n:"roommate";return "<div class='sm' style='margin-bottom:8px'>lavender is you, rose is "+esc(pen)+". A bigger dot means it matters more to them.</div>"+KEYS.map(function(k){var myAns=(me&&me.a&&me.a[k]!=null)?me.a[k]:2,peAns=(pe&&pe.a&&pe.a[k]!=null)?pe.a[k]:2;var myImp=(me&&me.i&&me.i[k]!=null)?me.i[k]:2,peImp=(pe&&pe.i&&pe.i[k]!=null)?pe.i[k]:2;var r=RANGE[k]||4;var x=(myAns-1)/(r-1)*100,y=(peAns-1)/(r-1)*100;
  return "<div class='tl'><span>"+SH[k]+"</span><div class='tk'><i class='ln2' style='left:"+Math.min(x,y)+"%;width:"+Math.abs(x-y)+"%'></i><b class='dt a' style='left:"+x+"%;--s:"+(8+me.i[k]*3)+"px'></b><b class='dt b' style='left:"+y+"%;--s:"+(8+pe.i[k]*3)+"px'></b></div></div>"}).join("")}
function matches(){
  var me=S.me;
  var h="<span class='hand'>built from real profiles, nothing made up</span><h1>your matches.</h1>";
  if(!me)return h+empty("take the quiz first.","Your matches are worked out from your own answers.","<button class='btn' data-go='quiz'>take the quiz</button>");
  h+="<p class='sub'>Share your profile code with classmates, and paste theirs below. Each student is scored on how closely your answers line up, weighted by what matters to you.</p>";
  h+="<div class='g2'><div class='card'><h3>share your profile</h3><p class='sm'>Send this code to a student so they can compare with you.</p><code class='cd'>"+myCode()+"</code><button class='btn gh' data-cp='1'>copy my code</button></div><div class='card'><h3>add a student</h3><textarea id='pe' placeholder='paste a student’s profile code' aria-label='Student profile code'></textarea><button class='btn' data-add='1'>add student</button></div></div><div class='msg' id='msg' role='status'></div>";
  if(!S.pe.length)return h+empty("no students added yet.","Ask a classmate to take the quiz and send you their profile code.");
  var rows=S.pe.map(function(p){return {p:p,r:score(p)}}).sort(function(a,b){return b.r.v-a.r.v});
  return h+rows.map(function(x,i){
    var p=x.p,r=x.r,top=i===0&&!r.clash.length&&r.v>=70,rq=reqOf(p.n);
    var ch=r.good.map(function(k){return "<span class='chip g'>you "+GOOD[k]+"</span>"}).join("");
    if(r.bad&&!r.clash.length)ch+="<span class='chip w'>"+BAD[r.bad]+"</span>";r.clash.forEach(function(k){ch+="<span class='chip r'>clashes on "+NM[k]+"</span>"});
    if(!ch)ch="<span class='chip w'>few traits line up</span>";
    var b=rq?(rq.status==="confirmed"?"<button class='btn ok' data-go='requests'>paired ✓</button>":"<button class='btn gh' data-go='requests'>request "+({sent:"sent",pending:"received",declined:"declined"})[rq.status]+", view</button>"):"<button class='btn' data-s='"+p.id+"'>send request</button>";
    return "<article class='card pc"+(top?" top":"")+"' style='--i:"+i+"'>"+(top?"<span class='rib'>best match</span>":"")+bloom([{p:p,c:"fp"},{p:me,c:"fm"}])+
    "<div><div class='tr'><div class='who'>"+tile(p.n)+"<div><h3>"+p.n+"</h3><span class='hand' style='font-size:21px'>the "+p.p+"</span></div></div><div class='sc'>"+r.v+"<small>/100</small></div></div><div class='chips'>"+ch+"</div>"+
    (r.clash.length?"<p class='err sm' style='font-weight:600;margin:10px 0 0'>This pairing breaks a deal-breaker you set.</p>":"")+"<div class='row'>"+b+"<button class='btn gh' data-t='1'>trait lines</button><button class='btn gh' data-d='"+p.id+"'>remove</button></div></div><div class='xp'>"+lines(me,p)+"</div></article>";
  }).join("");
}

/* REQUESTS */
var ST={sent:"waiting for them",pending:"needs your answer",confirmed:"paired",declined:"declined"};
function mk(peer,note){var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts=Date.now();
  var r={id:id,dir:"out",peer:peer,note:note,status:"sent",ts:ts,code:enc("KR-",{t:"q",i:id,f:S.me.n,o:peer,m:note,s:ts})};S.rq.push(r);sv();return r}
function reply(r){return enc("KR-",{t:"r",i:r.id,f:S.me.n,o:r.peer,k:r.status==="confirmed"?1:0})}
function rcard(r,i){
  var inn=r.dir==="in",s,f,L=inn?["received","your answer","paired"]:["asked","answered","paired"];
  if(r.status==="confirmed"){s=["done","done","done"];f=1}else if(r.status==="declined"){s=["done","no","off"];f=.5}else{s=["done","act","off"];f=0}
  var mkc={done:"✓",no:"✕",act:"",off:""},p=S.pe.filter(function(x){return same(x.n,r.peer)})[0],b="";
  if(r.status==="confirmed")b+="<div class='pair'><div class='pv'>"+tile(S.me.n)+tile(r.peer)+"</div><div><b>You and "+r.peer+" both said yes.</b><br><span class='sm' style='color:inherit;opacity:.8'>Ready for the warden to allot a room together.</span></div></div>";
  if(r.status==="sent")b+="<p class='sm' style='margin:14px 0 0'>Give this code to "+r.peer+". When they answer, paste their reply code in the box above.</p><code class='cd'>"+r.code+"</code><button class='btn gh' data-c='"+r.id+"'>copy code</button>";
  if(r.status==="pending")b+="<div class='row'><button class='btn' data-a='"+r.id+"'>accept</button><button class='btn gh' data-x='"+r.id+"'>decline</button></div>";
  if(inn&&r.status!=="pending")b+="<p class='sm' style='margin:14px 0 0'>Send this reply code back to "+r.peer+" so they can see your answer.</p><code class='cd'>"+reply(r)+"</code><button class='btn gh' data-r='"+r.id+"'>copy reply code</button>";
  if(!inn&&r.status==="declined")b+="<p class='sm' style='margin:14px 0 0'>"+r.peer+" chose not to pair this time. You can ask someone else.</p>";
  return "<article class='card rq "+r.status+"' style='--i:"+i+"'><div class='hd'><div class='who'>"+tile(r.peer)+"<div><h3>"+r.peer+"</h3><span class='sm'>"+(inn?"asked you":"you asked")+" on "+new Date(r.ts).toLocaleDateString(undefined,{day:"numeric",month:"short"})+(p?", "+score(p).v+"/100 match":"")+"</span></div></div><span class='st "+r.status+"'>"+ST[r.status]+"</span></div>"+
  (r.note?"<p class='nt'>“"+r.note+"”</p>":"")+"<div class='jr' style='--f:"+f+"'>"+L.map(function(l,j){return "<div class='nd "+s[j]+"'><i>"+mkc[s[j]]+"</i><span>"+l+"</span></div>"}).join("")+"</div>"+b+"<button class='btn gh' data-rm='"+r.id+"'>remove</button></article>";
}
function requests(){
  var h="<span class='hand'>two yeses make a pair</span><h1>your requests.</h1>";
  if(!S.me)return h+empty("take the quiz first.","Requests are sent under your name, which comes from the quiz.","<button class='btn' data-go='quiz'>take the quiz</button>");
  var c=function(f){return S.rq.filter(f).length};
  h+="<p class='sub'>With no server yet, requests travel as short codes. Send one to a student, they answer, and they send a reply code back. Paste it here and the pair is confirmed.</p>";
  h+="<div class='stats'>"+[["received",c(function(x){return x.dir==="in"})],["sent",c(function(x){return x.dir==="out"})],["paired",c(function(x){return x.status==="confirmed"})]].map(function(x){return "<div class='card stat'><b>"+x[1]+"</b><span>"+x[0]+"</span></div>"}).join("")+"</div>";
  h+="<div class='g2'><div class='card'><h3>send a request</h3><input type='text' id='pn' maxlength='24' placeholder='their name' aria-label='Their name'><input type='text' id='pm' maxlength='80' placeholder='a short note (optional)' aria-label='Note'><button class='btn' data-mk='1'>create request</button></div><div class='card'><h3>paste a code</h3><textarea id='cd' placeholder='a request or reply code from another student' aria-label='Code'></textarea><button class='btn' data-rd='1'>read code</button></div></div><div class='msg' id='msg' role='status'></div>";
  var l=S.rq.slice().sort(function(a,b){return b.ts-a.ts});
  return h+(l.length?l.map(rcard).join(""):empty("no requests yet.","Create one above, send one from your matches, or paste a code a student sent you."));
}

function draw(a){
  document.querySelectorAll(".nl button").forEach(function(b){b.classList.toggle("on",b.dataset.go===view)});
  cancelAnimationFrame(raf);
  $("#app").innerHTML="<div class='"+(a===false?"":"swap")+"'>"+({home:home,quiz:quiz,matches:matches,requests:requests})[view]()+"</div>";
  if(view==="home")waves();
}
function find(id){return S.rq.filter(function(x){return x.id===id})[0]}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.go)go(d.go);
  else if(d.q==="start"){Z.name=esc($("#nm").value).trim()||"Friend";Z.A={};Z.I={};Z.idx=0;Z.W=shuf(POOL).slice(0,2);Z.scr="q";draw()}
  else if(d.q==="next")qnext();
  else if(d.q==="back"){if(Z.idx>0){Z.idx--;draw()}else{Z.scr="intro";draw()}}
  else if(d.q==="res"){Z.scr="res";draw()}
  else if(d.q==="retake"){Z.scr="intro";draw()}
  else if(d.imp){Z.I[vis()[Z.idx].id]=+d.imp;draw(false)}
  else if(d.v!==undefined){var q=vis()[Z.idx];Z.A[q.id]=+d.v;if(q.c){if(!Z.I[q.id])Z.I[q.id]=2;draw(false)}else setTimeout(qnext,260)}
  else if(d.cp)copy(myCode(),b);
  else if(d.add){try{var o=dec("KP-",$("#pe").value),a={},i={};KEYS.forEach(function(k){var v=+o.a[k];if(!(v>=1&&v<=RANGE[k]))throw 0;a[k]=v;i[k]=[1,2,3].indexOf(+o.i[k])>-1?+o.i[k]:2});
    var n=esc(o.n).slice(0,24)||"Student",id=n+KEYS.map(function(k){return a[k]}).join("");
    S.pe=S.pe.filter(function(x){return x.id!==id}).concat([{n:n,p:esc(o.p).slice(0,40),a:a,i:i,id:id}]);sv();draw(false)}catch(x){msg("That does not look like a kindred profile code. Ask them to copy it again.")}}
  else if(d.s){var p=S.pe.filter(function(x){return x.id===d.s})[0];mk(p.n,"");go("requests")}
  else if(d.t){b.closest(".pc").classList.toggle("open")}
  else if(d.d){S.pe=S.pe.filter(function(x){return x.id!==d.d});sv();draw(false)}
  else if(d.mk){var pn=esc($("#pn").value).trim(),pm=esc($("#pm").value).trim();
    if(!pn)return msg("Enter the name of the student you want to pair with.");if(same(pn,S.me.n))return msg("That is your own name.");mk(pn,pm);draw(false);msg("Request created. Copy its code and give it to "+pn+".",1)}
  else if(d.rd){var o2;try{o2=dec("KR-",$("#cd").value)}catch(x){return msg("That does not look like a kindred code. Copy it again in full.")}
    if(o2.t==="q"){if(!same(o2.o,S.me.n))return msg("This request is for "+esc(o2.o)+", not "+S.me.n+".");if(find(o2.i))return msg("You already added this request.");
      S.rq.push({id:o2.i,dir:"in",peer:esc(o2.f),note:esc(o2.m),status:"pending",ts:+o2.s||Date.now()});sv();draw(false);msg(esc(o2.f)+" asked to pair with you. Accept or decline below.",1)}
    else if(o2.t==="r"){var r=find(o2.i);if(!r||r.dir!=="out")return msg("No request sent from this browser matches that reply.");r.status=o2.k?"confirmed":"declined";sv();draw(false);msg(o2.k?"Confirmed. You and "+r.peer+" are a pair.":r.peer+" declined this request.",!!o2.k)}
    else msg("That code type is not recognised.")}
  else if(d.a){find(d.a).status="confirmed";sv();draw(false);msg("You accepted. Send the reply code back.",1)}
  else if(d.x){find(d.x).status="declined";sv();draw(false);msg("You declined. Send the reply code so they know.",1)}
  else if(d.rm){S.rq=S.rq.filter(function(x){return x.id!==d.rm});sv();draw(false)}
  else if(d.c)copy(find(d.c).code,b);
  else if(d.r)copy(reply(find(d.r)),b);
});
draw();
})();
</script>
