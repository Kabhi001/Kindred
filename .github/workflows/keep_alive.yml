name: Keep Render Service Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -f -m 30 "https://kindred-matcher.onrender.com/health/" || curl -s -f -m 30 "https://kindred-matcher.onrender.com/" || echo "Ping finished"
